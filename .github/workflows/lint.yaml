---
name: 'Lint'

on:
  pull_request: {}
  push:
    branches:
      - 'master'

permissions:
  contents: 'read'

jobs:
  actionlint:
    name: 'Lint'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7'

      - name: 'Lint the workflows'
        uses: 'raven-actions/actionlint@v2'
        with:
          version: '1.7.12'
          pyflakes: false
