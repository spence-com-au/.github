---
name: 'Dependabot'

on:
  pull_request: {}

permissions:
  contents: 'write'
  pull-requests: 'write'

jobs:
  automerge:
    name: 'Automerge'
    runs-on: 'ubuntu-latest'

    # This approves the pull request, so it tests who triggered the run rather than who opened it: a person who pushes
    # to a Dependabot branch would otherwise have their commit approved for them. A re-run keeps the initial run's
    # `github.actor`, so `github.triggering_actor` is what stops a person re-running an earlier Dependabot run.
    if: "github.actor == 'dependabot[bot]' && github.triggering_actor == 'dependabot[bot]'"

    env:
      GH_TOKEN: '${{ github.token }}'
      PR_URL: '${{ github.event.pull_request.html_url }}'

    steps:
      # Fails unless the repository lets GitHub Actions approve pull requests (`can_approve_pull_request_reviews`). The
      # review is pinned to the commit that triggered the run, so it does not count for a commit pushed after it.
      - name: 'Approve the pull request'
        run: >-
          gh api --method POST "repos/${REPO}/pulls/${PR_NUMBER}/reviews"
          -f event=APPROVE -f commit_id="${HEAD_SHA}" -f body="${BODY}"
        env:
          REPO: '${{ github.repository }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          BODY: >-
            Approved by the Dependabot workflow rather than by a review: a Dependabot run has no repository secrets, so
            Claude cannot review it.

      - name: 'Enable auto-merge'
        run: 'gh pr merge --auto --squash "${PR_URL}"'
