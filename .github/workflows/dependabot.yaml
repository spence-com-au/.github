---
name: 'Dependabot'

on:
  pull_request: {}

permissions:
  contents: 'write'
  pull-requests: 'write'

jobs:
  automerge:
    name: 'Automerge'
    runs-on: 'ubuntu-latest'

    # This approves the pull request, so it tests who triggered the run rather than who opened it: a person who pushes
    # to a Dependabot branch would otherwise have their commit approved for them. A re-run keeps the initial run's
    # `github.actor`, so `github.triggering_actor` is what stops a person re-running an earlier Dependabot run.
    if: "github.actor == 'dependabot[bot]' && github.triggering_actor == 'dependabot[bot]'"

    # Both steps act on the commit that triggered the run, not on whatever the head is by the time they execute.
    env:
      GH_REPO: '${{ github.repository }}'
      GH_TOKEN: '${{ github.token }}'
      HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
      PR_NUMBER: '${{ github.event.pull_request.number }}'

    steps:
      # Fails unless the repository lets GitHub Actions approve pull requests (`can_approve_pull_request_reviews`). A
      # review on an older commit still counts toward required approvals, so pinning this one stops it covering a later
      # push only together with the `Require pull request` ruleset's `dismiss_stale_reviews_on_push`.
      - name: 'Approve the pull request'
        run: >-
          gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/reviews"
          -f event=APPROVE -f commit_id="${HEAD_SHA}"
          -f body='Approved by the Dependabot workflow rather than by a review: a Dependabot run has no repository
          secrets, so Claude cannot review it.'

      # Pinned too, so a commit pushed between the run being queued and approving is never merged on its approval.
      - name: 'Enable auto-merge'
        run: 'gh pr merge --auto --squash --match-head-commit "${HEAD_SHA}" "${PR_NUMBER}"'
