---
name: 'Prettier'

on:
  pull_request: {}
  push:
    branches:
      - 'master'

permissions:
  contents: 'read'

jobs:
  prettier:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7.0.1'
      - uses: 'pnpm/setup@v3.1.2'
        with:
          cache: true
      - run: 'pnpm prettier --check .'
