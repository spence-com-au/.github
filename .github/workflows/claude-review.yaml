---
# Named apart from the `claude.yaml` each repository calls the same workflow from, so that once the `Workflows` ruleset
# enforces this, its runs and checks can be told from theirs.
name: 'Claude Review'

on:
  pull_request: {}

permissions: {}

jobs:
  review:
    uses: 'spence-com-au/claude-code-action/.github/workflows/claude.yaml@master'
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}'
