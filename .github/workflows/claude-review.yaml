---
name: 'Claude Review'
run-name: 'Reviewing #${{ github.event.pull_request.number }} by @${{ github.event.pull_request.user.login }}'

on:
  # The review skips a draft, and marking it ready fires none of the default types, so `ready_for_review` is what
  # reviews it.
  pull_request:
    types:
      - 'opened'
      - 'reopened'
      - 'synchronize'
      - 'ready_for_review'

permissions: {}

jobs:
  review:
    uses: 'spence-com-au/claude-code-action/.github/workflows/claude.yaml@master'
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}'
